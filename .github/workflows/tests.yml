name: Marsi tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q marsi_local
      - run: for script in scripts/*.sh deploy/marsi-xsession.sh; do bash -n "$script"; done
      - run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - run: xvfb-run -a python -m tests.pi_display_smoke
  speech-decoder:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install -r requirements-server.txt
      - run: python -m pip check
      - run: python -m unittest tests.speech_decoder_smoke -v
