# Optional workaround: install only after confirming the modesetting driver.
# A generic OutputClass adds the cursor option to the auto-detected output;
# it does not select a graphics driver, device path, resolution or monitor.
# Rename the installed file so it no longer ends in .conf to undo this test.
Section "OutputClass"
    Identifier "Marsi software cursor"
    Option "SWcursor" "true"
EndSection
